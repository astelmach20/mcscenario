name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check tag matches project version
        run: |
          test "v$(./gradlew -q properties --property version | sed -n 's/^version: //p')" = "$GITHUB_REF_NAME"
      - run: ./gradlew test distZip distTar
      - run: gh release create "$GITHUB_REF_NAME" build/distributions/* --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
